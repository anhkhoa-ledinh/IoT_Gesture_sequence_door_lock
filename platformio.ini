; ============================================================================
;  platformio.ini — build firmware ESP32 tai may, de chay bang extension
;                   Wokwi for VS Code
; ----------------------------------------------------------------------------
;  Chi can file nay neu ban dung EXTENSION VS CODE. Neu dung web wokwi.com thi
;  KHONG can — web tu bien dich, chi can dan sketch.ino va diagram.json.
;
;  Extension Wokwi khong bien dich code. No chi mo phong file firmware.bin da
;  build san. PlatformIO lam viec build do.
;
;  src_dir tro thang vao firmware/ nen KHONG co ban sao thu hai cua gate_lock.cpp.
;  Mot file nguon duy nhat dung cho ca web IDE lan extension.
; ============================================================================

[platformio]
src_dir = firmware

[env:esp32dev]
platform  = espressif32
board     = esp32dev          ; ESP32 DevKit V1, khop wokwi-esp32-devkit-v1
framework = arduino

monitor_speed = 115200        ; khop Serial.begin(115200) trong gate_lock.cpp

; Sau thu vien, dung y bang o firmware/libraries.txt nhung theo dinh danh
; cua PlatformIO Registry (khac ten trong Arduino Library Manager).
; Chi ghim phien ban ArduinoJson vi code dung API v7 (JsonDocument khong
; kem kich thuoc) — ban v6 se khong bien dich duoc.
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7.0.0
    madhephaestus/ESP32Servo
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

build_flags =
    -Wall
